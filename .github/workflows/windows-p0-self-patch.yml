name: Apply Windows P0 tray patch

on:
  push:
    branches:
      - fix/windows-p0-shop-parity
    paths:
      - .github/workflows/windows-p0-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-p0-shop-parity
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/patch_windows_p0.py
      - name: Commit source and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/PokeTokenBar/WindowsTray.swift
          git rm .github/workflows/windows-p0-self-patch.yml scripts/patch_windows_p0.py
          git commit -m "feat(windows): wire P0 shop parity into tray"
          git push origin HEAD:fix/windows-p0-shop-parity
