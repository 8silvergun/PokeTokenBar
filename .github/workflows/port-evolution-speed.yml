name: Port Windows evolution speed

on:
  push:
    branches: [feat/windows-evolution-speed]

permissions:
  contents: write

jobs:
  apply-port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/windows-evolution-speed
          fetch-depth: 0

      - name: Apply targeted Windows port
        run: python3 scripts/port-evolution-speed.py

      - name: Verify targeted changes
        run: |
          test "$(grep -c 'EvolutionSpeedSettings.phaseThreshold' Sources/PokeTokenBar/Core/CompanionStore.swift)" -eq 5
          grep -q 'Evolution speed' Sources/PokeTokenBar/WindowsTray.swift
          grep -q 'adjustEvolutionSpeed' Sources/PokeTokenBar/WindowsTray.swift
          test -f Sources/PokeTokenBar/Core/EvolutionSpeedSettings.swift
          test -f Tests/PokeTokenBarTests/EvolutionSpeedSettingsTests.swift

      - name: Commit implementation and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/port-evolution-speed.yml scripts/port-evolution-speed.py
          git add Sources/PokeTokenBar/Core/CompanionStore.swift \
                  Sources/PokeTokenBar/Core/EvolutionSpeedSettings.swift \
                  Sources/PokeTokenBar/WindowsTray.swift \
                  Tests/PokeTokenBarTests/EvolutionSpeedSettingsTests.swift
          git commit -m 'feat(windows): add configurable evolution speed'
          git push origin HEAD:feat/windows-evolution-speed
