name: Diagnose Windows tests

on:
  push:
    branches: [feat/windows-evolution-speed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Swift 6.3.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3.3'

      - name: Capture swift test failure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = & swift test -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content windows-test.log
          if ($exitCode -eq 0) {
            "Windows diagnostic: `swift test -v` passed on $env:GITHUB_SHA." | Set-Content diagnostic.md
          } else {
            $interesting = @($output | Select-String -Pattern 'error:|failed|failure|XCTAssert|Test Case|fatal|undefined|unresolved' -CaseSensitive:$false | ForEach-Object { $_.Line })
            if ($interesting.Count -gt 120) { $interesting = $interesting[-120..-1] }
            @(
              "### Windows test diagnostic",
              "Commit: ``$env:GITHUB_SHA``",
              "Exit code: ``$exitCode``",
              "",
              '```text'
            ) + $interesting + @(
              '```'
            ) | Set-Content diagnostic.md
          }
          gh pr comment 28 --repo $env:GITHUB_REPOSITORY --body-file diagnostic.md
          exit 0
