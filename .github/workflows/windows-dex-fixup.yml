name: Fix Windows dex parity mapping

on:
  push:
    branches: [feat/windows-dex-parity]
    paths:
      - .github/workflows/windows-dex-fixup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-dex-parity
          fetch-depth: 0
      - name: Fix shared EvoLineItem mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Sources/PokeTokenBar/WindowsTray.swift')
          s = p.read_text(encoding='utf-8')
          old = 'guard case .species(let id) = item.subject else { return nil }'
          new = 'guard case .species(let id) = item.content else { return nil }'
          if s.count(old) != 1:
              raise SystemExit(f'expected one mapping occurrence, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/PokeTokenBar/WindowsTray.swift
          git rm .github/workflows/windows-dex-fixup.yml
          git commit -m "fix(windows): map shared evolution line content"
          git push origin HEAD:feat/windows-dex-parity
