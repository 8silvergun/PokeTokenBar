name: Windows CI

on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: windows-build-test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Swift 6.3.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3.3'

      - name: Show Swift version
        shell: pwsh
        run: swift --version

      - name: Build release binary
        shell: pwsh
        run: swift build -c release -v

      - name: Run Windows tests
        shell: pwsh
        run: swift test -v

      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PokeTokenBar-windows-x64
          path: .build/release/PokeTokenBar.exe
          if-no-files-found: error
