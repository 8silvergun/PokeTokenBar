name: Apply Windows parity patch once

on:
  push:
    branches:
      - feat/windows-settings-ops-parity
    paths:
      - scripts/windows_ops_patch.py
      - scripts/windows_companion_ux_patch.py
      - .github/workflows/apply-windows-settings-ops-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/windows-settings-ops-parity
          fetch-depth: 0

      - name: Apply settings and operations parity
        run: python3 scripts/windows_ops_patch.py

      - name: Apply companion UX parity
        run: python3 scripts/windows_companion_ux_patch.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/windows_ops_patch.py
          rm scripts/windows_companion_ux_patch.py
          rm .github/workflows/apply-windows-settings-ops-parity.yml

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(windows): add settings and companion UX parity"
          git push origin HEAD:feat/windows-settings-ops-parity
