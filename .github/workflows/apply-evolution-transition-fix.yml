name: Apply evolution transition fix

on:
  push:
    branches:
      - fix/windows-evolution-transition
    paths:
      - .github/workflows/apply-evolution-transition-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-evolution-transition
          fetch-depth: 0

      - name: Patch transition handling and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stores = [
              Path('Sources/PokeTokenBar/Core/CompanionStore.swift'),
              Path('Sources/PokeTokenBar/WindowsCore/CompanionStore.swift'),
          ]
          evolve_call = '                notifyCompanionEvent(l.notifEvolveTitle, l.notifEvolveBody(newName))\n'
          evolve_replacement = evolve_call + (
              '                // Keep one lifecycle transition visible per usage application. A large batched delta\n'
              '                // (especially at high evolution-speed multipliers) may already exceed the next stage,\n'
              '                // but its overflow stays in usedAtStage and is evaluated on the next usage application.\n'
              '                break\n'
          )
          for path in stores:
              text = path.read_text(encoding='utf-8')
              count = text.count(evolve_call)
              if count != 1:
                  raise SystemExit(f'{path}: expected one evolve notification call, found {count}')
              path.write_text(text.replace(evolve_call, evolve_replacement, 1), encoding='utf-8')

          tray = Path('Sources/PokeTokenBar/WindowsTray.swift')
          text = tray.read_text(encoding='utf-8')
          needle = '        var disp = await companion.windowsDisplay   // refreshed again after limit rewards below\n\n        var claude5h: Int?, claude7d: Int?\n'
          replacement = (
              '        var disp = await companion.windowsDisplay   // refreshed again after limit rewards below\n\n'
              '        // Publish the state transition before sprite/network prefetching. Evolution notifications can\n'
              '        // reach the Win32 loop immediately, while a newly selected sprite may still need remote I/O;\n'
              '        // without this repaint the popup can look frozen on the previous egg/form until refresh ends.\n'
              '        lock.withLock { currentDisplay = disp }\n'
              '        if let sinkHwnd { _ = PostMessageW(sinkHwnd, updateMessage, 0, 0) }\n\n'
              '        var claude5h: Int?, claude7d: Int?\n'
          )
          if text.count(needle) != 1:
              raise SystemExit('WindowsTray.swift: refresh snapshot anchor changed')
          tray.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          windows_test = r'''#if os(Windows)
          import Foundation
          import XCTest
          @testable import PokeTokenBar

          private struct EvolutionTransitionStubProvider: PokeProviding {
              func line(baseSpeciesID: Int) async throws -> EvoLine {
                  EvoLine(
                      baseID: 46,
                      tree: EvoNode(speciesID: 46, children: [
                          EvoNode(speciesID: 47, children: [])
                      ]),
                      rarity: .common,
                      names: [46: ["en": "Paras"], 47: ["en": "Parasect"]]
                  )
              }

              func baseSpeciesIndex() async throws -> [BaseSpecies] {
                  [BaseSpecies(id: 46, captureRate: 255)]
              }

              func baseSpecies(id: Int) async throws -> BaseSpecies? {
                  BaseSpecies(id: id, captureRate: 255)
              }
          }

          final class EvolutionTransitionTests: XCTestCase {
              func testLargeBatchedUsageStopsAfterVisibleEvolution() async {
                  let key = EvolutionSpeedSettings.key
                  let previous = UserDefaults.standard.object(forKey: key)
                  EvolutionSpeedSettings.multiplier = 20
                  defer {
                      if let previous { UserDefaults.standard.set(previous, forKey: key) }
                      else { UserDefaults.standard.removeObject(forKey: key) }
                  }

                  let url = FileManager.default.temporaryDirectory
                      .appendingPathComponent("windows-evolution-transition-\(UUID().uuidString).json")
                  defer { try? FileManager.default.removeItem(at: url) }

                  let store = await CompanionStore(provider: EvolutionTransitionStubProvider(), fileURL: url)
                  await store.hatch(baseID: 46)
                  await store.applyUsage(100_000_000)

                  var snapshot = await store.state
                  guard let active = snapshot.active else {
                      XCTFail("Large batched usage must not evolve and graduate in the same application")
                      return
                  }
                  XCTAssertEqual(active.currentID, 47)
                  XCTAssertEqual(active.stageIndex, 1)
                  XCTAssertTrue(snapshot.dex.isEmpty)
                  XCTAssertGreaterThanOrEqual(
                      active.usedAtStage,
                      EvolutionSpeedSettings.phaseThreshold(rarity: .common, totalForms: 2, stageIndex: 1)
                  )

                  // The excess tokens are deferred, not discarded. A later application can graduate normally.
                  await store.applyUsage(0)
                  snapshot = await store.state
                  XCTAssertNil(snapshot.active)
                  XCTAssertEqual(snapshot.dex.last?.finalID, 47)
              }
          }
          #endif
          '''
          windows_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in windows_test.splitlines()) + '\n'
          Path('Tests/PokeTokenBarWindowsTests/EvolutionTransitionTests.swift').write_text(windows_test, encoding='utf-8')

          core_test = r'''import Foundation
          import XCTest
          @testable import PokeTokenBar

          private struct EvolutionTransitionCoreStubProvider: PokeProviding {
              func line(baseSpeciesID: Int) async throws -> EvoLine {
                  EvoLine(
                      baseID: 46,
                      tree: EvoNode(speciesID: 46, children: [
                          EvoNode(speciesID: 47, children: [])
                      ]),
                      rarity: .common,
                      names: [46: ["en": "Paras"], 47: ["en": "Parasect"]]
                  )
              }

              func baseSpeciesIndex() async throws -> [BaseSpecies] {
                  [BaseSpecies(id: 46, captureRate: 255)]
              }

              func baseSpecies(id: Int) async throws -> BaseSpecies? {
                  BaseSpecies(id: id, captureRate: 255)
              }
          }

          @MainActor
          final class EvolutionTransitionCoreTests: XCTestCase {
              func testLargeBatchedUsageStopsAfterVisibleEvolution() async {
                  let key = EvolutionSpeedSettings.key
                  let previous = UserDefaults.standard.object(forKey: key)
                  EvolutionSpeedSettings.multiplier = 20
                  defer {
                      if let previous { UserDefaults.standard.set(previous, forKey: key) }
                      else { UserDefaults.standard.removeObject(forKey: key) }
                  }

                  let url = FileManager.default.temporaryDirectory
                      .appendingPathComponent("core-evolution-transition-\(UUID().uuidString).json")
                  defer { try? FileManager.default.removeItem(at: url) }

                  let store = CompanionStore(provider: EvolutionTransitionCoreStubProvider(), fileURL: url)
                  await store.hatch(baseID: 46)
                  store.applyUsage(100_000_000)

                  var snapshot = store.state
                  guard let active = snapshot.active else {
                      XCTFail("Large batched usage must not evolve and graduate in the same application")
                      return
                  }
                  XCTAssertEqual(active.currentID, 47)
                  XCTAssertEqual(active.stageIndex, 1)
                  XCTAssertTrue(snapshot.dex.isEmpty)
                  XCTAssertGreaterThanOrEqual(
                      active.usedAtStage,
                      EvolutionSpeedSettings.phaseThreshold(rarity: .common, totalForms: 2, stageIndex: 1)
                  )

                  store.applyUsage(0)
                  snapshot = store.state
                  XCTAssertNil(snapshot.active)
                  XCTAssertEqual(snapshot.dex.last?.finalID, 47)
              }
          }
          '''
          core_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in core_test.splitlines()) + '\n'
          Path('Tests/PokeTokenBarTests/EvolutionTransitionTests.swift').write_text(core_test, encoding='utf-8')

          defect = Path('docs/reference/defect-log.md')
          entry = r'''

          ## 2026-09-17 — High evolution speed could skip the evolved form on Windows

          - **Symptom:** after an evolution toast (for example Paras → Parasect), the Windows UI could appear stuck and then show an egg; selecting the evolved species in the Pokédex made that species visible again.
          - **Root cause:** `applyUsage` consumed an entire batched usage delta in a loop. At a high evolution-speed multiplier, one refresh could cross both the evolution threshold and the final-form graduation threshold, so the app evolved and immediately set `active = nil` in `graduate()`. Separately, Windows did not publish the new `CompanionDisplay` until after sprite/network prefetching, so the notification could arrive while the popup still rendered the previous snapshot.
          - **Class sweep:** the one-transition rule is applied to both `Core/CompanionStore.swift` and the Windows compatibility snapshot. Windows now publishes the state snapshot before sprite I/O. Egg hatching, token accounting, shop currency, and overflow carry-forward are unchanged.
          - **Regression:** platform tests inject a two-stage Paras/Parasect line at 20× speed and a delta large enough to exceed both thresholds. They require the first application to stop on Parasect with overflow preserved, and a later application to graduate normally.
          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines())
          current = defect.read_text(encoding='utf-8')
          if 'High evolution speed could skip the evolved form on Windows' not in current:
              defect.write_text(current.rstrip() + entry + '\n', encoding='utf-8')

          Path('.github/workflows/diagnose-windows-tests.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-evolution-transition-fix.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve evolved form across batched usage"
          git push origin HEAD:fix/windows-evolution-transition
