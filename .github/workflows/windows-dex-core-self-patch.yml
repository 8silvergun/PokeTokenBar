name: Apply WindowsCore collection parity

on:
  push:
    branches: [feat/windows-dex-parity]
    paths:
      - .github/workflows/windows-dex-core-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-dex-parity
          fetch-depth: 0
      - name: Forward-port collection semantics into WindowsCore
        run: python scripts/windows_dex_core_patch.py
      - name: Commit source and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/PokeTokenBar/WindowsCore/CompanionModel.swift Sources/PokeTokenBar/WindowsCore/CompanionStore.swift Sources/PokeTokenBar/WindowsTray.swift
          git rm scripts/windows_dex_core_patch.py .github/workflows/windows-dex-core-self-patch.yml
          git commit -m "feat(windows): forward-port collection semantics"
          git push origin HEAD:feat/windows-dex-parity
