name: Apply evolution speed multiplier patch

on:
  push:
    branches:
      - feature/evolution-speed-multiplier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/evolution-speed-multiplier

      - name: Apply source patch
        run: |
          python3 scripts/apply-evolution-speed-patch.py
          rm scripts/apply-evolution-speed-patch.py
          rm .github/workflows/apply-evolution-speed-patch.yml

      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable evolution speed multiplier"
          git push origin HEAD:feature/evolution-speed-multiplier
